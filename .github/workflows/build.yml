name: Build Guilds

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean shadowJar --no-daemon

      - name: List build artifacts
        run: |
          echo "=== build/libs ==="
          ls -lah build/libs/

      - name: Verify JAR
        run: |
          JAR_COUNT=$(find build/libs -maxdepth 1 -type f -name "*.jar" | wc -l)

          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "ERROR: No JAR file was produced."
            exit 1
          fi

          echo "Found $JAR_COUNT JAR file(s):"
          find build/libs -maxdepth 1 -type f -name "*.jar" -print

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Guilds-Folia-26.2
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
